---
- name: Remove legacy Codex notification hooks
  agent_json_hooks:
    path: ~/.codex/hooks.json
    command: "{{ ansible_facts['user_dir'] }}/.codex/hooks/notification.sh"
    events: []
    state: absent

- name: Remove legacy Claude notification hooks
  agent_json_hooks:
    path: ~/.claude/settings.json
    command: "{{ ansible_facts['user_dir'] }}/.claude/hooks/notification.sh"
    events: []
    state: absent

- name: Read login user ID
  ansible.builtin.command:
    argv: [/usr/bin/id, -u]
  register: agents_notify_uid
  changed_when: false
  check_mode: false

- name: Inspect legacy Othinus notification LaunchAgent
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ agents_notify_uid.stdout }}/dev.rafr.othinus-agent-notify"
  register: agents_notify_service
  changed_when: false
  failed_when: agents_notify_service.rc not in [0, 113]
  check_mode: false

- name: Unload legacy Othinus notification LaunchAgent
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - bootout
      - "gui/{{ agents_notify_uid.stdout }}/dev.rafr.othinus-agent-notify"
  changed_when: true
  when: agents_notify_service.rc == 0

- name: Remove legacy notification files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - ~/.local/bin/agent-notify
    - ~/.local/bin/othinus-agent-notify-listen
    - ~/.codex/hooks/notification.sh
    - ~/.claude/hooks/notification.sh
    - ~/.config/opencode/plugins/notification.ts
    - ~/.pi/agent/extensions/notification.ts
    - ~/Library/LaunchAgents/dev.rafr.othinus-agent-notify.plist
