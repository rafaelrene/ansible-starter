---
- name: Discover skills
  ansible.builtin.find:
    paths: "{{ role_path }}/files/skills"
    file_type: directory
    recurse: false
  register: agents_skills

- name: Ensure skill directories exist
  loop: "{{ agents_skill_dirs }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: u=rwx,go=

# Distribution only ever adds links, so deleting a skill from files/skills
# leaves a dangling link in every agent. The next three tasks find each link,
# resolve its target, and drop the ones pointing at nothing, so every
# destination heals itself on the next run.
- name: Find distributed skill links
  loop: "{{ agents_skill_dirs }}"
  ansible.builtin.find:
    paths: "{{ item }}"
    file_type: link
    recurse: false
  register: agents_skill_links

- name: Resolve skill link targets
  loop: "{{ agents_skill_links.results | map(attribute='files') | flatten }}"
  loop_control:
    label: "{{ item.path }}"
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: true
  register: agents_skill_link_targets

- name: Prune dangling skill links
  loop: >-
    {{ agents_skill_link_targets.results | default([])
       | rejectattr('stat.exists') | list }}
  loop_control:
    label: "{{ item.item.path }}"
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent

- name: Symlink skills to all agents
  loop: "{{ agents_skills.files | product(agents_skill_dirs) | list }}"
  loop_control:
    label: "{{ item.1 }}/{{ item.0.path | basename }}"
  ansible.builtin.file:
    src: "{{ item.0.path }}"
    dest: "{{ item.1 }}/{{ item.0.path | basename }}"
    state: link
    force: true
