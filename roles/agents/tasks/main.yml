---
- name: Setup agent-specific configs
  ansible.builtin.include_tasks:
    file: "{{ item }}"
  loop:
    - opencode.yml
    - codex.yml
    - claude.yml
    - pi.yml

- name: Distribute agent rules
  ansible.builtin.include_tasks: agent_rules.yml

- name: Distribute skills to all agents
  ansible.builtin.include_tasks: agent_skills.yml

- name: Distribute macOS notification hooks
  ansible.builtin.include_tasks: agent_hooks.yml
  when: ansible_facts['os_family'] == 'Darwin'
